<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>OpenCode Pet</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="bubble-area">
      <div id="bubble" class="bubble hidden"></div>
    </div>
    <canvas id="view"></canvas>

    <div id="composer" class="composer hidden">
      <input id="prompt" placeholder="对宠物说点什么…（Enter 发送）" />
      <button id="send" title="发送">➤</button>
      <button id="composer-close" title="关闭">✕</button>
    </div>

    <div id="settings" class="settings hidden">
      <button id="settings-close" class="settings-close" title="关闭">✕</button>
      <div class="settings-title">设置</div>
      <label>
        <span>来源</span>
        <div class="dd" id="dd-mode"></div>
      </label>
      <label>
        <span>对话模型</span>
        <div class="dd" id="dd-model"></div>
      </label>
      <label>
        <span>声音</span>
        <div class="dd" id="dd-voice"></div>
      </label>
      <label>
        <span>语速</span>
        <div class="dd" id="dd-rate"></div>
      </label>
      <label>
        <span>音调</span>
        <div class="dd" id="dd-pitch"></div>
      </label>
      <div id="settings-hint" class="hint"></div>
    </div>

    <div id="menu" class="context-menu hidden">
      <button class="menu-close" data-action="closeMenu" title="关闭">✕</button>
      <button data-action="compose">💬 输入消息</button>
      <button data-action="voice">📢 朗读上一条</button>
      <button data-action="voiceNext">📢 朗读下一条</button>
      <button data-action="mute">🔇 静音</button>
      <div class="menu-group">
        <button data-action="switchModel">🧍 换模型</button>
        <div id="model-list" class="menu-sub hidden"></div>
      </div>
      <div class="menu-group">
        <button data-action="switchAnim">🎬 动作</button>
        <div id="anim-list" class="menu-sub hidden"></div>
      </div>
      <button data-action="settings">⚙ 设置</button>
      <button data-action="models">📁 打开模型文件夹</button>
      <button data-action="importAnim">📥 导入动作文件</button>
      <div class="sep"></div>
      <button data-action="quit">✕ 退出</button>
    </div>

    <script type="module" src="./renderer.js"></script>
  </body>
</html>
