<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>OpenCode Pet</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="drag" title="拖动移动窗口">⠿</div>
    <div class="bubble-area">
      <div id="bubble" class="bubble hidden"></div>
    </div>
    <canvas id="view"></canvas>

    <div id="composer" class="composer hidden">
      <input id="prompt" placeholder="对 OpenCode 说点什么…（Enter 发送，Esc 关闭）" />
      <button id="send" title="发送">➤</button>
    </div>

    <div id="settings" class="settings hidden">
      <div class="settings-title">模型设置</div>
      <label>
        <span>来源</span>
        <select id="mode">
          <option value="go">OpenCode Go</option>
          <option value="api">API</option>
        </select>
      </label>
      <label>
        <span>模型</span>
        <select id="model"></select>
      </label>
      <label>
        <span>声音</span>
        <select id="voice">
          <option value="zh-CN-XiaoxiaoNeural">晓晓 · 温暖（女）</option>
          <option value="zh-CN-XiaoyiNeural">晓伊 · 活泼（女）</option>
          <option value="zh-CN-YunjianNeural">云健 · 激情（男）</option>
          <option value="zh-CN-YunxiNeural">云希 · 阳光（男）</option>
          <option value="zh-CN-YunxiaNeural">云夏 · 可爱（男）</option>
          <option value="zh-CN-YunyangNeural">云扬 · 专业（男）</option>
          <option value="zh-CN-liaoning-XiaobeiNeural">晓北 · 东北话（女）</option>
          <option value="zh-CN-shaanxi-XiaoniNeural">晓妮 · 陕西话（女）</option>
          <option value="zh-HK-HiuGaaiNeural">曉佳 · 粤语（女）</option>
          <option value="zh-HK-HiuMaanNeural">曉曼 · 粤语（女）</option>
          <option value="zh-HK-WanLungNeural">雲龍 · 粤语（男）</option>
          <option value="zh-TW-HsiaoChenNeural">曉臻 · 台湾（女）</option>
          <option value="zh-TW-HsiaoYuNeural">曉雨 · 台湾（女）</option>
          <option value="zh-TW-YunJheNeural">雲哲 · 台湾（男）</option>
          <option value="system">系统语音（离线）</option>
        </select>
      </label>
      <label>
        <span>语速</span>
        <select id="rate">
          <option value="-20%">慢</option>
          <option value="-10%">稍慢</option>
          <option value="+0%">正常</option>
          <option value="+10%">稍快</option>
          <option value="+20%">快</option>
        </select>
      </label>
      <label>
        <span>音调</span>
        <select id="pitch">
          <option value="-5Hz">低</option>
          <option value="+0Hz">正常</option>
          <option value="+5Hz">高</option>
        </select>
      </label>
      <div id="settings-hint" class="hint"></div>
    </div>

    <div id="menu" class="context-menu hidden">
      <button data-action="compose">💬 输入消息</button>
      <button data-action="voice">📢 朗读上一条</button>
      <button data-action="mute">🔇 静音</button>
      <button data-action="dance">💃 跳舞</button>
      <button data-action="settings">⚙ 模型设置</button>
      <div class="sep"></div>
      <button data-action="quit">✕ 退出</button>
    </div>

    <script type="module" src="./renderer.js"></script>
  </body>
</html>
